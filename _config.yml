# Book settings
title: Manning-ENGR133
author: Ben Manning
logo: logo.png

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Corrected indentation for Thebe and Pyodide dependencies
thebe:
  kernel_name: "python3"
  dependencies:
    - numpy
    - pandas
    - matplotlib

# Information about where the book exists on the web
repository:
  url: https://github.com/btmannin5132/133Teach
  path_to_book: ""
  branch: main

# HTML theme and button configuration
html:
  theme:
    name: sphinx_book_theme
    options:
      default_mode: dark
  use_issues_button: true
  use_repository_button: true
  use_folder_names: false

# Corrected launch buttons block
launch_buttons:
  thebe: true

sphinx:
  config:
    html_theme_options:
      use_thebe_button: true

execute:
  execute_notebooks: force