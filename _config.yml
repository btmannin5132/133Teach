# Book settings
title: Manning-ENGR133
author: Ben Manning
logo: logo.png

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Information about where the book exists on the web
repository:
  url: https://github.com/btmannin5132/133Teach
  path_to_book: ""
  branch: main

# Add GitHub buttons to your book
html:
  theme:
    name: sphinx_book_theme
    options:
      default_mode: dark
  use_issues_button: true
  use_repository_button: true
  use_folder_names: false

# Standard launch configuration
launch_buttons:
  notebook_interface: jupyterlab

# Explicitly load the sphinx_thebe extension
sphinx:
  extra_extensions:
    - sphinx_thebe
  config:
    html_theme_options:
      use_thebe_button: true

# Thebe configuration for browser-side execution
thebe:
  kernel_name: "python3"
  dependencies:
    - numpy
    - pandas
    - matplotlib

execute:
  execute_notebooks: force